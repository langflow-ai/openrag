name: Frontend Unit Tests

# Fast Vitest layer: jsdom + Testing Library + MSW, no Docker and no services.
# The Playwright E2E suite is unchanged and still runs in test-ci.yml.
# See local/plans/frontend-testing-foundation.md.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend-unit.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend-unit.yml'

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm test
