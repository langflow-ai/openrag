name: Publish Docker Images to GHCR

# What: publish every OpenRAG image for AMD64 and ARM64 on demand.
# Why: production runs on ARM64 while developers also need AMD64 images.
# How: use the existing workflow_dispatch publisher with GHCR and Buildx.
# Compatibility: callers can still override the tag and target platforms.
# KISS: one manual publisher and no GitHub/PyPI release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the images (defaults to the commit SHA if empty)'
        required: false
      platforms:
        description: 'Platforms to build for (e.g., linux/amd64,linux/arm64)'
        required: true
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        id: repo
        run: |
          echo "name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine build parameters
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${{ github.sha }}"
          fi
          PLATFORMS="${{ github.event.inputs.platforms }}"

          SANITIZED_TAG=$(echo "$RAW_TAG" | sed 's/[^A-Za-z0-9_.-]/-/g')
          SANITIZED_TAG=$(echo "$SANITIZED_TAG" | sed 's/^[^A-Za-z0-9]*//')
          if [ -z "$SANITIZED_TAG" ]; then
            echo "The image tag is empty after sanitization."
            exit 1
          fi
          TAG=$(printf '%.128s' "$SANITIZED_TAG")

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/openrag-backend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/openrag-frontend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

      - name: Build and push Langflow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.langflow
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/openrag-langflow:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=langflow
          cache-to: type=gha,mode=max,scope=langflow
          provenance: false

      - name: Build and push OpenSearch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/openrag-opensearch:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=opensearch
          cache-to: type=gha,mode=max,scope=opensearch
          provenance: false
