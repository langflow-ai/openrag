# Which model providers OpenRAG offers, per run mode.
#
# This file is the single source of truth for provider visibility in the
# Settings provider cards, the Onboarding tabs, and the model catalogue that
# feeds every agent/ingest picker. The backend filters on it; the UI renders
# whatever the API returns, so there is no second denylist in the frontend.
#
# Keys under `modes` match OPENRAG_RUN_MODE: oss | on_prem | saas.
#   true  -> the provider is shown in that mode
#   false -> the provider is hidden
# A missing mode key means hidden, so adding a new run mode can never expose a
# provider by accident.
#
# A provider that is not listed here is not offered anywhere in the UI. A model
# id for an unlisted provider can still be typed by hand and will be routed if
# the gateway already supports it.
#
# Set OPENRAG_MODEL_PROVIDERS_CONFIG to another YAML file to override this list
# for a single deployment; this file is the default.
#
# A row may also declare `models` / `embedding_models`. LiteLLM's bundled table
# already knows the public vendors, so those rows need nothing. A self-hosted
# OpenAI-compatible gateway serves whatever its operator deployed, and those ids
# can only come from here — see the commented example at the end of this file.
#
# `exclude_models` keeps ids out of the pickers. `*` and `?` wildcards work, and
# matching is against the id as the picker shows it (`gpt-3.5-turbo`, not
# `openai/gpt-3.5-turbo`). Exclusion is applied last, so it also overrides a
# `models` row on the same provider. Models the provider has already retired are
# dropped without being listed here, and ones retiring within 90 days are hidden
# behind a "Show N retiring" row in the picker — use this for the ones a
# deployment does not want offered at all.

providers:
  - name: openai
    display_name: OpenAI
    modes:
      oss: true
      on_prem: true
      saas: true
    exclude_models:
      - gpt-3.5-* # a whole generation, superseded and near retirement
      - gpt-5.6-luna # refuses function tools on /v1/chat/completions

  - name: ollama
    display_name: Ollama
    modes:
      oss: true
      on_prem: true
      saas: false # local inference is not offered in SaaS

  - name: watsonx
    display_name: IBM watsonx.ai
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: anthropic
    display_name: Anthropic
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: oci
    display_name: OCI Generative AI
    modes:
      oss: true
      on_prem: true
      saas: true
  # enabled in OSS for tests only to be disbaled in OSS after tests are complete
  - name: azure_ai
    display_name: Azure AI Foundry
    modes:
      oss: false
      on_prem: false
      saas: false
  # enabled in OSS for tests only to be disbaled in OSS after tests are complete

  # Azure OpenAI Service, which LiteLLM keys separately from Foundry above:
  # `azure_ai` is the Foundry catalogue (Llama, Phi, Mistral, Cohere, and the
  # gpt-5.x entries Foundry serves), `azure` is the OpenAI Service deployment
  # where the gpt-4.1 family lives. Both can be offered at once.
  - name: azure
    display_name: Azure OpenAI
    modes:
      oss: true
      on_prem: true
      saas: true
    # Azure serves the same OpenAI models, so it needs the same exclusions.
    # The plain name covers the regional ids (`eu/`, `us/`, `global/`) too.
    exclude_models:
      - gpt-3.5-*
    # Azure lets you name a deployment anything, so LiteLLM's table cannot know
    # yours. Declare them here and they appear in the pickers for everyone;
    # otherwise each user has to type the name into the model box by hand.
    # models:
    #   - prod-gpt41-eastus
    # embedding_models:
    #   - prod-embed-3-large

  # A self-hosted OpenAI-compatible endpoint (vLLM, LM Studio, an internal
  # gateway). Use one of LiteLLM's passthrough provider keys — `openai_like`,
  # `hosted_vllm`, `lm_studio`, `llamafile`, `custom_openai` — rather than
  # inventing a name: the key has to be one LiteLLM can route, or the
  # `provider:model` ids it publishes resolve to the default provider and get
  # called with the wrong credentials. The endpoint and key are entered in
  # Settings; only the model ids belong here.
  #
  # - name: openai_like
  #   display_name: Internal LLM Gateway
  #   modes:
  #     oss: true
  #     on_prem: true
  #     saas: false
  #   models:
  #     - llama-3.3-70b-instruct
  #     - qwen2.5-coder-32b
  #   embedding_models:
  #     - bge-m3
