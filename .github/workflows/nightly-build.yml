name: Nightly Docker Build

on:
  schedule:
    # Runs daily at 04:00 UTC (10 PM Central)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.repository == 'langflow-ai/openrag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Tags
        id: vars
        run: |
          DATE_PART=$(date -u +%y%m%d)
          # Use the GitHub run number to create a unique, auto-incrementing suffix
          # This is more robust than querying Docker Hub (Copilot suggestion)
          NIGHTLY_VERSION="nightly-${DATE_PART}.${{ github.run_number }}"
          echo "nightly_version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $NIGHTLY_VERSION"

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-backend:${{ steps.vars.outputs.nightly_version }}
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-backend:nightly
          cache-from: type=gha,scope=nightly-backend
          cache-to: type=gha,mode=max,scope=nightly-backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-frontend:${{ steps.vars.outputs.nightly_version }}
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-frontend:nightly
          cache-from: type=gha,scope=nightly-frontend
          cache-to: type=gha,mode=max,scope=nightly-frontend

      - name: Build and push Langflow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.langflow
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-langflow:${{ steps.vars.outputs.nightly_version }}
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-langflow:nightly
          cache-from: type=gha,scope=nightly-langflow
          cache-to: type=gha,mode=max,scope=nightly-langflow

      - name: Build and push OpenSearch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-opensearch:${{ steps.vars.outputs.nightly_version }}
            ${{ secrets.DOCKER_NAMESPACE }}/openrag-opensearch:nightly
          cache-from: type=gha,scope=nightly-opensearch
          cache-to: type=gha,mode=max,scope=nightly-opensearch
