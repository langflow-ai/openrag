name: Publish OpenRAG source ref for ARM64

# What: build the backend, frontend, and Langflow images from an explicit OpenRAG ref.
# Why: test a contribution on the ARM64 cluster without adding build commits to its PR branch.
# How: checkout the requested ref from the fork, build natively on ARM64, and publish SHA-tagged images.
# Compatibility: all images governed by the GitOps global tag are published under the same immutable SHA.
# KISS: one manual workflow, three runtime images, one architecture, and no moving tag.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: agent/local-source-lifecycle
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-openrag-arm64-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} for ARM64
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
          - name: langflow
            dockerfile: Dockerfile.langflow

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Determine immutable image coordinates
        id: image
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "name=ghcr.io/${repository}/openrag-${{ matrix.name }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=openrag-${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=openrag-${{ matrix.name }}-arm64

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "### OpenRAG ${{ matrix.name }}"
            echo
            echo "- Image: \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
