services:
  opensearch:
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -kfsS -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" 'https://localhost:9200/_cluster/health' > /dev/null",
        ]

  dashboards:
    ports:
      - "127.0.0.1:5601:5601"

  openrag-backend:
    env_file:
      - .env

  openrag-frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  langflow:
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"

  valkey:
    ports: []
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --io-threads 4
      --io-threads-do-reads yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping > /dev/null"]


