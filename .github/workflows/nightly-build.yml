name: Nightly Docker Build

on:
  schedule:
    # Runs daily at 04:00 UTC (10 PM Central)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  check-version:
    if: github.repository == 'langflow-ai/openrag'
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.vars.outputs.nightly_version }}
    steps:
      - name: Determine Nightly Version
        id: vars
        run: |
          DATE_PART=$(date -u +%y%m%d)
          # Use the GitHub run number to create a unique, auto-incrementing suffix
          NIGHTLY_VERSION="nightly-${DATE_PART}.${{ github.run_number }}"
          echo "nightly_version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $NIGHTLY_VERSION"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend
          - image: backend
            file: ./Dockerfile.backend
            service: openrag-backend
            platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - image: backend
            file: ./Dockerfile.backend
            service: openrag-backend
            platform: linux/arm64
            arch: arm64
            runs-on: [self-hosted, Linux, ARM64, langflow-ai-arm64-40gb-ephemeral]

          # frontend
          - image: frontend
            file: ./Dockerfile.frontend
            service: openrag-frontend
            platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - image: frontend
            file: ./Dockerfile.frontend
            service: openrag-frontend
            platform: linux/arm64
            arch: arm64
            runs-on: [self-hosted, Linux, ARM64, langflow-ai-arm64-40gb-ephemeral]

          # langflow
          - image: langflow
            file: ./Dockerfile.langflow
            service: openrag-langflow
            platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - image: langflow
            file: ./Dockerfile.langflow
            service: openrag-langflow
            platform: linux/arm64
            arch: arm64
            runs-on: [self-hosted, Linux, ARM64, langflow-ai-arm64-40gb-ephemeral]

          # opensearch
          - image: opensearch
            file: ./Dockerfile
            service: openrag-opensearch
            platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - image: opensearch
            file: ./Dockerfile
            service: openrag-opensearch
            platform: linux/arm64
            arch: arm64
            runs-on: [self-hosted, Linux, ARM64, langflow-ai-arm64-40gb-ephemeral]

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKER_NAMESPACE }}/${{ matrix.service }}:${{ needs.check-version.outputs.nightly_version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=nightly-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    needs: [build, check-version]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifests
        run: |
          NS=${{ secrets.DOCKER_NAMESPACE }}
          VERSION=${{ needs.check-version.outputs.nightly_version }}
          
          SERVICES=("openrag-backend" "openrag-frontend" "openrag-langflow" "openrag-opensearch")
          
          for SVC in "${SERVICES[@]}"; do
            echo "Creating manifest for $SVC..."
            
            # Create versioned multi-arch manifest
            docker buildx imagetools create -t $NS/$SVC:$VERSION \
              $NS/$SVC:$VERSION-amd64 \
              $NS/$SVC:$VERSION-arm64
              
            # Update floating nightly tag
            docker buildx imagetools create -t $NS/$SVC:nightly \
              $NS/$SVC:$VERSION-amd64 \
              $NS/$SVC:$VERSION-arm64
          done
