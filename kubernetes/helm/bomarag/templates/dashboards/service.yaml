{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bomarag.fullname" . }}-dashboards
  namespace: {{ include "bomarag.namespace" . }}
  labels:
    {{- include "bomarag.dashboards.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboards.service.type }}
  ports:
    - port: {{ .Values.dashboards.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bomarag.dashboards.selectorLabels" . | nindent 4 }}
{{- end }}
