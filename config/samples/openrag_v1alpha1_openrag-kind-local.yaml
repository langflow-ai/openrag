# OpenRAG sample for local kind/Colima clusters (typically 2 CPUs).
#
# Build and load images from the repo root (Docker/Colima):
#   make kind-build-load-apps
#   # or: make build-be build-fe build-lf && make kind-load-app-images
#
# Apply (operator must be running via `make run` or deployed):
#   kubectl create namespace my-tenant
#   kubectl apply -f config/samples/openrag_v1alpha1_openrag-kind-local.yaml
#
# After rebuilding images, reload into kind and restart workloads:
#   make kind-load-app-images
#   kubectl rollout restart deployment -n my-tenant openrag-fe openrag-be openrag-lf
#
# imagePullPolicy: Never — use images pre-loaded with `kind load docker-image` (do not pull from registry).
apiVersion: openr.ag/v1alpha1
kind: OpenRAG
metadata:
  name: my-openrag
  namespace: my-tenant
spec:
  targetNamespace: my-tenant

  frontend:
    image: langflowai/openrag-frontend:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  backend:
    image: langflowai/openrag-backend:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "4Gi"
    storage:
      enabled: true
      size: "1Gi"

  langflow:
    image: langflowai/openrag-langflow:latest
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    storage:
      enabled: true
      size: "1Gi"
    flowsRef: release-saas-0.1
    # if you are hitting github rate limits for flow download uncomment this and set
    # the secret 
    # flowsGithubTokenSecret:
    #   name: github-token
    #   key: token

  networkPolicy:
    enabled: false

# Optional secret you can set since sometimes you will hit github rate limits on downloading flows
# from github. To obtain do:
# from your github -> settings -> developer settings -> Personal Access Tokens
# -> fine grained token -> create a new token with read access and paste it here
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: github-token
#   namespace: my-tenant
# type: Opaque
# stringData:
#   token: <your-github-pat>
