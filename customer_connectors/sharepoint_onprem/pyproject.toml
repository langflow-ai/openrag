[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrag-sharepoint-onprem"
version = "0.1.0"
description = "SharePoint Server (NTLM) connector for OpenRAG"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "requests-ntlm>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.entry-points."openrag.connectors.v1"]
sharepoint_onprem = "sharepoint_onprem:SharePointOnPremConnector"

[tool.setuptools.packages.find]
where = ["src"]
